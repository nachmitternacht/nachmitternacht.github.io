<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — nach.mitternacht</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages shows this page for any address that doesn't exist, so all links start at the site root (/) -->
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/images/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="/images/favicon-192.png?v=2" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/night.js?v=4"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #151515;
    --muted: #9a9a9a;
    --line: #e4e4e4;
    --gutter: clamp(16px, 2.6vw, 40px);
    --sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 500 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* Same header as the other pages */
  .top { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; justify-content: space-between; align-items: baseline; padding: 22px var(--gutter) 14px; background: var(--bg); }
  .logo { line-height: 0; }
  .logo img { width: 193px; height: auto; transform: translateY(3px); } /* sits a touch lower, in line with the menu */
  .nav { display: flex; gap: 15px; font-size: 14px; }

  /* centred like the start screen */
  main { min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 80px var(--gutter); text-align: center; }
  h1 { font-size: 20px; font-weight: 560; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; }
  p { color: var(--muted); }
  .back { margin-top: 10px; border-bottom: 1px solid currentColor; padding-bottom: 2px; }

  .nav a, .logo, .back { display: inline-block; transition: transform .4s cubic-bezier(.2, .7, .2, 1); }
  .nav a:hover, .logo:hover, .back:hover { transform: scale(1.02); }
  .logo { transform-origin: left center; }

  @media (max-width: 720px) {
    .top { flex-wrap: wrap; gap: 6px; align-items: flex-end; }
    .logo img { width: 140px; }
    .nav { gap: 10px; line-height: 1; }
    h1 { font-size: 16px; letter-spacing: .24em; margin-right: -.24em; }
  }
  @view-transition { navigation: auto; }
  .top { view-transition-name: top; }
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="/"><img src="/images/logo-bergamot-medium.png" alt="nach.mitternacht" width="193" height="32"></a>
  <nav class="nav">
    <a href="/#work">Work</a><a href="/#about">About</a><a href="/#contact">Contact</a><a href="/#shop">Shop</a>
  </nav>
</header>

<main>
  <h1>Page not found</h1>
  <p>This page got lost somewhere after midnight.</p>
  <a class="back" href="/">← Back to the start</a>
</main>

<script src="/cursor.js?v=5"></script>
</body>
</html>
